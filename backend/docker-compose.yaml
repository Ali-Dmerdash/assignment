name: ottonomi-assignment

services:
  mongo:
    image: mongo:7
    container_name: ottonomi-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ottonomi-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=${PORT}
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - UPLOAD_DIR=/app/uploads
      - CORS_ORIGIN=${CORS_ORIGIN}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - uploads:/app/uploads

volumes:
  mongo-data:
  uploads:
